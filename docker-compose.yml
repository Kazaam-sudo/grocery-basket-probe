services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocery_probe
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery_probe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
